name: WebGL Build Verification

on:
  pull_request:
    paths:
      - 'Assets/**'
      - 'ProjectSettings/**'
      - 'Packages/**'
      - 'Deploy/**'
      - 'Server/**'
      - 'scripts/**'

jobs:
  verify-artifacts:
    name: Verify Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if WebGL build exists
        id: check-build
        run: |
          if [ -d "Deploy/webgl-build" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy/webgl-build not found — skipping artifact verification. Run scripts/build-webgl.sh locally first."
          fi

      - name: Verify WebGL build artifacts
        if: steps.check-build.outputs.exists == 'true'
        run: |
          chmod +x scripts/verify-webgl-build.sh
          ./scripts/verify-webgl-build.sh

  verify-docker:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: verify-artifacts
    steps:
      - uses: actions/checkout@v4
      - name: Check if WebGL build exists
        id: check-build
        run: |
          if [ -d "Deploy/webgl-build" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy/webgl-build not found — skipping Docker smoke test."
          fi

      - name: Build and test Docker image
        if: steps.check-build.outputs.exists == 'true'
        run: |
          chmod +x scripts/verify-webgl-build.sh scripts/verify-webgl-docker.sh
          ./scripts/verify-webgl-docker.sh

  unity-tests:
    name: Unity EditMode Tests
    runs-on: ubuntu-latest
    if: ${{ vars.UNITY_TESTS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          testMode: EditMode
