name: WebGL Build Verification

on:
  pull_request:
    paths:
      - 'Assets/**'
      - 'ProjectSettings/**'
      - 'Packages/**'
      - 'Deploy/**'
      - 'Server/**'
      - 'scripts/**'

jobs:
  verify-artifacts:
    name: Verify Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify WebGL build artifacts
        run: |
          chmod +x scripts/verify-webgl-build.sh
          ./scripts/verify-webgl-build.sh

  verify-docker:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: verify-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build and test Docker image
        run: |
          chmod +x scripts/verify-webgl-build.sh scripts/verify-webgl-docker.sh
          ./scripts/verify-webgl-docker.sh

  unity-tests:
    name: Unity EditMode Tests
    runs-on: ubuntu-latest
    if: ${{ vars.UNITY_TESTS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          testMode: EditMode
