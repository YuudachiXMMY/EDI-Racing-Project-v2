name: Unity — Request Activation File (one-time)

# Helper for the one-time Unity PERSONAL license setup used by the
# prod-ithaca-build workflow. Run this manually to obtain a `.alf` file, then
# convert it to a `.ulf` at https://license.unity3d.com/manual and store the
# `.ulf` contents in the UNITY_LICENSE repository secret.
#
# Full walkthrough: docs/deployment/prod-ithaca-ci.md
#
# You only need this for a free Personal license. If you have a Plus/Pro seat,
# skip this entirely and configure UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD.

on:
  workflow_dispatch: {}

jobs:
  request-activation:
    name: Request .alf activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          # Download this artifact, upload the .alf to license.unity3d.com/manual,
          # then paste the returned .ulf contents into the UNITY_LICENSE secret.
          name: Unity_v2026.x.alf
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
