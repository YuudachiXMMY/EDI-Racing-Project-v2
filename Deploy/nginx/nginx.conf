worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Gzip for non-precompressed assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Runtime upstream resolution so nginx boots even if web-app is absent (single-container
        # smoke test). Used by the /game auth subrequest, /api, and the site root proxy below.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $survey_upstream web-app;

        # Local liveness endpoint — served entirely by nginx so the container healthcheck does
        # NOT depend on web-app being reachable (the game container can pass its own healthcheck
        # in a solo smoke test where web-app is absent).
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # WebSocket reverse proxy
        location /ws {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Unity WebGL build — access-gated at /game/ ───────────────────────────────
        # The build is NOT public. Every request under /game/ is authorized by an
        # auth_request subrequest to the web-app, which checks the HttpOnly `game_access`
        # cookie minted by /api/game/enter (valid host token, or a live room). A request
        # without a valid cookie (stale/guessed link, or a direct hit) → 401 → bounced to the
        # survey app root. auth_request is inherited by the nested asset locations below.
        location = /_game_gate {
            internal;
            proxy_pass http://$survey_upstream:3001/api/game/gate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Original-URI $request_uri;
        }

        location @game_denied {
            return 302 /;
        }

        # ^~ makes this prefix win over the survey app's `location /` proxy AND over regex
        # asset locations, so all Unity static handling is confined here and never shadows the
        # React app's /assets/*.js at the root. Unity's index.html uses RELATIVE Build/ paths,
        # so serving the build from /usr/share/nginx/html/game/ (root + full URI) needs no
        # rebuild.
        location ^~ /game/ {
            auth_request /_game_gate;
            error_page 401 403 = @game_denied;
            try_files $uri $uri/ /game/index.html;

            # Every asset under /game/ is a Brotli-precompressed file served with an explicit
            # `Content-Encoding: br` (see the *.br blocks below). The http-level `gzip on`
            # otherwise re-compresses the already-brotli framework.js.br (its default_type is
            # application/javascript, which is in gzip_types), producing a stacked
            # `Content-Encoding: br, gzip` with NO Content-Length. Chrome unwinds the stack, but
            # older Safari, corporate proxies, and some CDNs do not — the framework then fails to
            # decode and Unity's loader hangs. Disable gzip here so /game/ assets keep a single,
            # correct Content-Encoding and their Content-Length.
            gzip off;

            # Brotli + MIME. nginx regex locations are first-match-wins in file order, so the
            # specific *.js.br / *.wasm.br / *.data.br blocks MUST precede the generic \.br$
            # fallback (else framework.js.br is served as octet-stream and the loader hangs at
            # 90% under nosniff). Each block carries its own cache headers since only one
            # location ever serves a given request.
            location ~ \.js\.br$ {
                add_header Content-Encoding br;
                add_header Cache-Control "public, immutable";
                expires 1y;
                default_type application/javascript;
            }

            location ~ \.wasm\.br$ {
                add_header Content-Encoding br;
                add_header Cache-Control "public, immutable";
                expires 1y;
                default_type application/wasm;
            }

            location ~ \.data\.br$ {
                add_header Content-Encoding br;
                add_header Cache-Control "public, immutable";
                expires 1y;
                default_type application/octet-stream;
            }

            location ~ \.br$ {
                add_header Content-Encoding br;
                add_header Cache-Control "public, immutable";
                expires 1y;
                default_type application/octet-stream;
            }

            location ~ \.wasm$ {
                default_type application/wasm;
            }

            location ~ \.data$ {
                default_type application/octet-stream;
            }

            location ~* \.(js|wasm|data|br|unityweb)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Survey Web App API proxy
        location ^~ /api {
            proxy_pass http://$survey_upstream:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Back-compat: the survey app used to live at /survey/. Redirect old links to the new
        # root. Browsers preserve the URL fragment across a 301 with no fragment, so a shared
        # /survey/#/s/CODE deep link still lands on /#/s/CODE.
        location ^~ /survey/ {
            return 301 /;
        }

        # Survey Web App (React SPA) is now the site root. Everything not matched above — /,
        # /assets/*, index.html — proxies to the web-app Express server, which serves the Vite
        # build (base '/') and its API.
        location / {
            proxy_pass http://$survey_upstream:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
