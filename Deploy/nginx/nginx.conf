worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Gzip for non-precompressed assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # WebSocket reverse proxy
        location /ws {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Unity WebGL Brotli-compressed files
        location ~ \.br$ {
            add_header Content-Encoding br;
            default_type application/octet-stream;
        }

        location ~ \.js\.br$ {
            add_header Content-Encoding br;
            default_type application/javascript;
        }

        location ~ \.wasm\.br$ {
            add_header Content-Encoding br;
            default_type application/wasm;
        }

        location ~ \.data\.br$ {
            add_header Content-Encoding br;
            default_type application/octet-stream;
        }

        # Correct MIME types for uncompressed Unity files
        location ~ \.wasm$ {
            default_type application/wasm;
        }

        location ~ \.data$ {
            default_type application/octet-stream;
        }

        # Cache static assets
        location ~* \.(js|wasm|data|br|unityweb)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Survey Web App API proxy
        location /api {
            proxy_pass http://web-app:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
