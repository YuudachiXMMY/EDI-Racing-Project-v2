worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Gzip for non-precompressed assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # WebSocket reverse proxy
        location /ws {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Unity WebGL Brotli-compressed files.
        # IMPORTANT: nginx regex locations are first-match-wins in file order, so
        # the specific *.js.br / *.wasm.br / *.data.br blocks MUST come BEFORE the
        # generic \.br$ fallback. Otherwise the fallback claims framework.js.br and
        # serves it as application/octet-stream; the browser then refuses to execute
        # it under strict MIME checking (X-Content-Type-Options: nosniff) and the
        # Unity loader hangs at 90%. Each block also carries its own cache headers
        # because only one location block ever serves a given request.
        location ~ \.js\.br$ {
            add_header Content-Encoding br;
            add_header Cache-Control "public, immutable";
            expires 1y;
            default_type application/javascript;
        }

        location ~ \.wasm\.br$ {
            add_header Content-Encoding br;
            add_header Cache-Control "public, immutable";
            expires 1y;
            default_type application/wasm;
        }

        location ~ \.data\.br$ {
            add_header Content-Encoding br;
            add_header Cache-Control "public, immutable";
            expires 1y;
            default_type application/octet-stream;
        }

        # Generic Brotli fallback (e.g. *.symbols.json.br) — MUST stay last of the
        # .br blocks so it never shadows the specific MIME types above.
        location ~ \.br$ {
            add_header Content-Encoding br;
            add_header Cache-Control "public, immutable";
            expires 1y;
            default_type application/octet-stream;
        }

        # Correct MIME types for uncompressed Unity files
        location ~ \.wasm$ {
            default_type application/wasm;
        }

        location ~ \.data$ {
            default_type application/octet-stream;
        }

        # Cache static assets
        location ~* \.(js|wasm|data|br|unityweb)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Survey Web App — 运行时解析上游，web-app 容器缺席时 nginx 仍可启动（单容器冒烟测试）
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $survey_upstream web-app;

        # Survey Web App (React SPA at /survey/)
        # ^~ makes this prefix win over the regex asset locations above (e.g.
        # `~* \.(js|...)$`). Without it, `/survey/assets/*.js` matches that regex
        # first and nginx serves it from the local Unity root (404 -> blank page)
        # instead of proxying to web-app. CSS slips through only because `.css`
        # isn't in the regex list.
        location ^~ /survey/ {
            proxy_pass http://$survey_upstream:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Survey Web App API proxy
        location ^~ /api {
            proxy_pass http://$survey_upstream:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
