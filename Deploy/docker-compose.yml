services:
  edi-racing:
    build:
      context: ..
      dockerfile: Deploy/Dockerfile
    ports:
      - "8080:80"
    environment:
      - PORT=3000
    depends_on:
      web-app:
        condition: service_healthy
    restart: unless-stopped

  web-app:
    build:
      context: ../web-app
      dockerfile: Dockerfile
    volumes:
      - survey-data:/app/data
    environment:
      - API_PORT=3001
      - DB_PATH=/app/data/edi-survey.db
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  survey-data:
