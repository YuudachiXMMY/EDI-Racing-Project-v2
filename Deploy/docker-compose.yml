# EDI-Racing unified Docker Compose — one command runs Game + WebSocket Server + Web App.
#
# Single origin: the game container's nginx (:80) is the edge and routes
#   /            -> Survey web app (web-app Express + SQLite on :3001; serves the React SPA + API)
#   /game/       -> Unity WebGL (static, Brotli) — access-gated via /api/game/gate
#   /ws          -> WebSocket relay (Server/server.js on :3000, in-container)
#   /api         -> Survey web app API (:3001)
#   /survey/     -> 301 redirect to / (back-compat for old links)
#
# Self-contained: `docker compose up --build` needs no external network.
# Production TLS / edge routing is layered via docker-compose.prod.yml.
#
#   Local:  docker compose -f Deploy/docker-compose.yml up --build   (-> http://localhost:${GAME_PORT:-3900})
#   Prod:   docker compose -f Deploy/docker-compose.yml -f Deploy/docker-compose.prod.yml up -d

name: edi-racing

services:
  edi-racing:
    build:
      context: ..
      dockerfile: Deploy/Dockerfile
    container_name: edi-racing-game
    ports:
      - "${GAME_PORT:-3900}:80"
    environment:
      # WS server port — must match nginx.conf upstream (127.0.0.1:3000)
      - PORT=3000
      # Cross-container session archive -> web-app (Server/server.js posts here)
      - API_URL=http://web-app:3001
      # Required (no public default): the web-app's /game/ access gate ALWAYS trusts this secret
      # to verify the game_access cookie, so the committed default would let anyone forge one and
      # bypass the gate. `:?` fails compose fast with a clear message. Generate once:
      #   export INTERNAL_SECRET=$(openssl rand -hex 32)
      # Must match the web-app service's value byte-for-byte (same signing key across processes).
      - INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET must be set (e.g. openssl rand -hex 32); the /game/ access gate is never safe with the public default}
      # When true, create_room also requires a valid host token (minted by web-app). Default false
      # keeps local WS testing simple; production ENABLES it via docker-compose.prod.yml.
      - REQUIRE_HOST_TOKEN=${REQUIRE_HOST_TOKEN:-false}
    healthcheck:
      # 127.0.0.1 (not localhost): nginx listens on IPv4 0.0.0.0:80 only, while
      # `localhost` resolves to IPv6 ::1 first inside the container -> false unhealthy.
      # /healthz is served locally by nginx (not proxied to web-app), so the game container
      # stays healthy on its own even in a solo smoke test where web-app is absent.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      web-app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      edi-racing-net:
        # web-app resolves this container via WS_GAME_URL=ws://edi-racing-game:3000
        aliases:
          - edi-racing-game

  web-app:
    build:
      context: ../web-app
      dockerfile: Dockerfile
    container_name: edi-racing-api
    # Not published to the host by default — reached through the nginx edge at / and /api.
    # Uncomment for direct debugging:
    # ports:
    #   - "${API_PORT:-3901}:3001"
    volumes:
      - survey-data:/app/data
    environment:
      - API_PORT=3001
      - DB_PATH=/app/data/edi-survey.db
      - WS_GAME_URL=ws://edi-racing-game:3000
      # Required — see the edi-racing service above. This process serves the /game/ access gate,
      # which is fatal on the public default. Must equal the game container's INTERNAL_SECRET.
      - INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET must be set (e.g. openssl rand -hex 32); the /game/ access gate is never safe with the public default}
      # Password-reset email via the self-hosted Stalwart SMTP server. Values arrive from the
      # deploy-server .env (populated by apps/ediracing/.env.extra). Empty defaults keep local
      # `up --build` quiet: with SMTP_HOST unset, mailConfigured() is false and the app boots
      # with reset emails disabled (a warning, not a failure). In production the prod overlay
      # already attaches web-app to the external `proxy` network, so `stalwart:587` resolves.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@${DOMAIN:-localhost}}
      # Public origin for the emailed reset link (HashRouter: ${APP_BASE_URL}/#/reset-password?token=…).
      - APP_BASE_URL=${APP_BASE_URL:-https://${DOMAIN:-localhost}}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - edi-racing-net

volumes:
  survey-data:

networks:
  edi-racing-net:
    driver: bridge
