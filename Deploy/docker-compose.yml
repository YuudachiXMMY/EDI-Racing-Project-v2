services:
  edi-racing:
    build:
      context: ..
      dockerfile: Deploy/Dockerfile
    ports:
      - "8080:80"
    environment:
      - PORT=3000
    depends_on:
      - web-app
    restart: unless-stopped

  web-app:
    build:
      context: ../web-app
      dockerfile: Dockerfile
    volumes:
      - survey-data:/app/data
    environment:
      - API_PORT=3001
      - DB_PATH=/app/data/edi-survey.db
    restart: unless-stopped

volumes:
  survey-data:
